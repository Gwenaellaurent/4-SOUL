<body>
    <!-- Cet élément DOIT être visible au démarrage -->
    <div id="loading-overlay">
        <img src="TemplateData/background_compressed.png" id="loading-bg" onerror="this.style.display='none';">
        
        <div id="ui-container">
            <h2 style="margin-top:0;">Existential Archetypes</h2>
            <p id="loading-status">Initialisation...</p>
            
            <input type="text" id="username" placeholder="Entrez votre nom...">
            <br>
            <!-- Bouton caché par défaut -->
            <button id="start-button" style="display:none;" onclick="launchGame()">ENTRER DANS L'ABYSS</button>
        </div>
    </div>

    <div id="unityContainer"></div>

    <script>
        // 1. Bloquer l'alerte mobile immédiatement
        window.alert = function(msg) {
            console.log("Alerte bloquée : " + msg);
            if (msg.indexOf("nom") !== -1) return window.confirm(msg); // Laisse passer mon alerte de nom
            return true;
        };

        // 2. Lancer Unity
        var gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                var status = document.getElementById("loading-status");
                var btn = document.getElementById("start-button");
                
                var percentage = Math.round(progress * 100);
                status.innerHTML = "Téléchargement : " + percentage + "%";
                
                if (progress >= 1) {
                    status.innerHTML = "Liaison prête !";
                    btn.style.setProperty('display', 'inline-block', 'important');
                }
            }
        });

        // 3. Fonction pour enfin cacher l'overlay
        function launchGame() {
            var user = document.getElementById("username").value;
            if (user.trim() === "") {
                // On utilise un petit hack pour que l'alerte de nom marche quand même
                var name = prompt("Veuillez entrer un nom :");
                if (!name) return;
                document.getElementById("username").value = name;
            }
            
            // On cache l'overlay
            document.getElementById("loading-overlay").style.display = "none";
            console.log("Jeu lancé pour : " + user);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL | Existential Archetypes</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh; overflow: hidden; background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100dvh;
            background-color: #000;
            z-index: 9999 !important; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loading-bg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -1; opacity: 0.5;
        }

        #ui-container {
            z-index: 10000;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 15px;
            color: white;
            border: 1px solid #00ffcc;
            width: 300px;
            pointer-events: auto !important;
        }

        .field-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 0.8em; color: #00ffcc; display: block; margin-bottom: 5px; }

        input, select { 
            width: 100%; padding: 10px; border-radius: 5px; border: none; 
            background: #222; color: white; box-sizing: border-box;
        }

        button { 
            width: 100%; padding: 12px; background: #00ffcc; color: black; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
            margin-top: 10px; transition: 0.3s;
        }

        button:disabled { background: #444; color: #888; cursor: not-allowed; }

        #unityContainer { width: 100vw; height: 100dvh; z-index: 1; }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <img src="TemplateData/background_compressed.png" id="loading-bg">
        
        <div id="ui-container">
            <h2 style="margin-top:0; color:#00ffcc;">IDENTIFICATION</h2>
            
            <div class="field-group">
                <label>NOM D'ÂME</label>
                <input type="text" id="username" placeholder="Pseudo...">
            </div>

            <div class="field-group">
                <label>DATE DE NAISSANCE</label>
                <input type="date" id="birthdate">
            </div>

            <div class="field-group">
                <label>GENRE</label>
                <select id="gender">
                    <option value="Homme">Homme</option>
                    <option value="Femme">Femme</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <p id="loading-status" style="font-size: 0.7em;">Chargement du moteur...</p>
            <button id="start-button" disabled onclick="launchGame()">COMMENCER</button>
        </div>
    </div>

    <div id="unityContainer"></div>

    <script>
        // 1. Bloquer l'alerte de compatibilité
        window.alert = function(msg) {
            if (msg.indexOf("WebGL") !== -1) return true;
            console.log("Alert:", msg);
        };

        // 2. Initialisation Unity
        var gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                var status = document.getElementById("loading-status");
                var btn = document.getElementById("start-button");
                status.innerHTML = "Synchronisation : " + Math.round(progress * 100) + "%";
                
                if (progress >= 1) {
                    status.innerHTML = "Connexion établie.";
                    btn.disabled = false;
                    // DESACTIVER LA CAPTURE CLAVIER pour laisser le formulaire fonctionner
                    if (typeof WebGLInput !== "undefined") {
                        WebGLInput.captureAllKeyboardInput = false;
                    }
                }
            }
        });

        // 3. Envoyer les données et lancer
        function launchGame() {
            var user = document.getElementById("username").value;
            var birth = document.getElementById("birthdate").value;
            var gen = document.getElementById("gender").value;

            if (!user || !birth) {
                console.log("Formulaire incomplet");
                return;
            }

            // Préparation des données (format JSON simple)
            var userData = {
                username: user,
                birthdate: birth,
                gender: gen
            };
            var jsonString = JSON.stringify(userData);

            // ENVOI À UNITY
            // Paramètre 1 : Le nom du GameObject dans ta scène Unity
            // Paramètre 2 : Le nom de la fonction publique dans ton script C#
            // Paramètre 3 : La donnée (le JSON)
            gameInstance.SendMessage('ReceiverObject', 'ReceiveUserData', jsonString);

            // On réactive la capture clavier pour le jeu si nécessaire
            if (typeof WebGLInput !== "undefined") {
                WebGLInput.captureAllKeyboardInput = true;
            }

            // Fermeture de l'overlay
            document.getElementById("loading-overlay").style.display = "none";
        }
    </script>
</body>
</html>
