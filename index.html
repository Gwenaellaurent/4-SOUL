<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Existential Archetypes</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* On remet le conteneur en fond */
        #unityContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* L'overlay est une simple couche noire par-dessus */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #loading-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; z-index: -1; }

        #ui-container { width: 280px; text-align: center; }

        input, select {
            width: 100%; padding: 12px; margin: 8px 0;
            background: #111; border: 1px solid #444; color: #fff;
            font-size: 16px; box-sizing: border-box;
        }

        button {
            width: 100%; padding: 15px; margin-top: 15px;
            background: #fff; color: #000; border: none; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
        }

        button:disabled { background: #333; color: #666; }

        #fs-button {
            position: fixed; bottom: 15px; right: 15px; z-index: 100;
            background: rgba(255,255,255,0.1); border: 1px solid #555;
            color: #fff; padding: 8px; font-size: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="unityContainer"></div>

    <div id="loading-overlay">
        <img src="TemplateData/background_compressed.png" id="loading-bg">
        <div id="ui-container">
            <input type="text" id="username" placeholder="NOM D'ÂME">
            <input type="date" id="birthdate">
            <select id="gender">
                <option value="" disabled selected>GENRE</option>
                <option value="Homme">HOMME</option>
                <option value="Femme">FEMME</option>
                <option value="Autre">AUTRE</option>
            </select>
            <p id="status" style="color: #666; font-size: 10px; margin-top: 15px;">INITIALISATION...</p>
            <button id="start-button" disabled onclick="launchGame()">COMMENCER</button>
        </div>
    </div>

    <button id="fs-button" onclick="toggleFullScreen()">Fullscreen</button>

    <script>
        // On désactive immédiatement l'interception de Unity
        var gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                var s = document.getElementById("status");
                var b = document.getElementById("start-button");
                s.innerHTML = "CHARGEMENT : " + Math.round(progress * 100) + "%";
                if (progress >= 1) {
                    s.innerHTML = "PRÊT";
                    b.disabled = false;
                }
            }
        });

        // LE SECRET POUR LE CLAVIER :
        // On surveille les clics. Si l'utilisateur clique sur un input, 
        // on force Unity à arrêter de capturer le clavier.
        setInterval(function() {
            if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT") {
                if (typeof WebGLInput !== "undefined") {
                    WebGLInput.captureAllKeyboardInput = false;
                }
            }
        }, 500);

        function launchGame() {
            var u = document.getElementById("username").value;
            var b = document.getElementById("birthdate").value;
            var g = document.getElementById("gender").value;

            if (!u || !b || !g) {
                alert("Champs incomplets");
                return;
            }

            // Envoi à Unity
            var data = JSON.stringify({username: u, birthdate: b, gender: g});
            gameInstance.SendMessage('ReceiverObject', 'ReceiveUserData', data);

            // On cache l'overlay et on redonne le clavier à Unity
            document.getElementById("loading-overlay").style.display = "none";
            if (typeof WebGLInput !== "undefined") {
                WebGLInput.captureAllKeyboardInput = true;
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
