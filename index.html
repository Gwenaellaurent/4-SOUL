<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL | Existential Archetypes</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
        /* 1. Reset et plein écran dynamique */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        /* 2. L'Overlay de chargement personnalisé */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background-color: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* L'image de fond */
        #loading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.7; /* Pour mieux voir le texte par-dessus */
        }

        /* Le formulaire au centre */
        #ui-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #444;
            color: white;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin: 10px 0;
            width: 80%;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 3. Le conteneur Unity */
        #unityContainer {
            width: 100vw;
            height: 100dvh;
        }
    </style>
</head>

<body>
    <!-- OVERLAY VISUEL -->
    <div id="loading-overlay">
        <!-- Vérifie bien le nom exact ici : TemplateData/... -->
        <img src="TemplateData/background_compressed.png" id="loading-bg">
        
        <div id="ui-container">
            <h2>Existential Archetypes</h2>
            <label for="username">Choisissez votre nom d'âme :</label><br>
            <input type="text" id="username" placeholder="Votre nom..."><br>
            
            <p id="loading-status">Initialisation du moteur...</p>
            
            <!-- Ce bouton sera caché au début et s'affichera à 100% -->
            <button id="start-button" style="display:none;" onclick="closeOverlay()">COMMENCER</button>
        </div>
    </div>

    <!-- JEU WEBGL -->
    <div id="unityContainer"></div>

    <script>
        // A. BLOCAGE DE L'ALERTE MOBILE (Anti-Pop-up WebGL)
        window.alert = (function(oldAlert) {
            return function(msg) {
                if (msg.indexOf("WebGL") !== -1 || msg.indexOf("compatibility") !== -1) {
                    console.log("Unity Alert Blocked: " + msg);
                } else {
                    oldAlert(msg);
                }
            };
        })(window.alert);

        // B. CHARGEMENT UNITY
        var gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                var statusText = document.getElementById("loading-status");
                var startBtn = document.getElementById("start-button");
                
                if (progress < 1) {
                    statusText.innerHTML = "Chargement des consciences : " + Math.round(progress * 100) + "%";
                } else {
                    statusText.innerHTML = "Liaison établie !";
                    startBtn.style.display = "inline-block"; // On montre le bouton quand c'est prêt
                }
            }
        });

        // C. FONCTION POUR FERMER L'OVERLAY
        function closeOverlay() {
            var name = document.getElementById("username").value;
            if (name === "") {
                alert("Veuillez entrer un nom pour continuer.");
                return;
            }
            // Tu peux envoyer le nom à Unity ici si besoin :
            // gameInstance.SendMessage('NomDeTonObjet', 'MethodeReception', name);
            
            document.getElementById("loading-overlay").style.display = "none";
        }
    </script>
</body>
</html>
