            document.getElementById("loading-overlay").style.display = "none";
        }

        function toggleFullScreen() {
            var doc = window.document;
            var docEl = doc.documentElement;

            var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if(!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {

            } else {
                cancelFullScreen.call(doc);
            }
        }
    </script>

        // On désactive immédiatement l'interception de Unity
        var gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                //var s = document.getElementById("status");
                var b = document.getElementById("start-button");
                b.innerHTML = "CHARGEMENT : " + Math.round(progress * 100) + "%";
                if (progress >= 1) {
                    b.innerHTML = "Commencer";
                    b.disabled = false;
                }
            }
        });

      // On collecte la variable IP

        function launchGame() {
            var n = document.getElementById("nationality").value;
            var b = document.getElementById("birthdate").value;
            var g = document.getElementById("gender").value;

            /*if (!n || !b || !g) {
                alert("Champs incomplets");
                return;
            }*/
            if(!n) n = "Inconnu";
            if(!b) b = "Inconnu";
            if(!g) g = "Inconnu";
          
            // Envoi à Unity
            //gameInstance.SendMessage('URLFormManager', 'ReceiveIP', userIP);  
            gameInstance.SendMessage('URLFormManager', 'ReceiveNationality', n);
            gameInstance.SendMessage('URLFormManager', 'ReceiveGender', g);
            gameInstance.SendMessage('URLFormManager', 'ReceiveBirthday', b);

            // On cache l'overlay et on redonne le clavier à Unity
            document.getElementById("unityContainer").focus();
            document.getElementById("loading-overlay").style.display = "none";
            //document.getElementById("fs-button").style.display = "none";
            /*if (typeof WebGLInput !== "undefined") {
                WebGLInput.captureAllKeyboardInput = true;
            }*/
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
