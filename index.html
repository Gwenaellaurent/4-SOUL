<!DOCTYPE html>

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* On remet le conteneur en fond */
        #unityContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* L'overlay est une simple couche noire par-dessus */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            touch-action: none;
        }

        #loading-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; z-index: -1; }

        #ui-container { width: 280px; text-align: center; }

        input, select {
            width: 100%; padding: 12px; margin: 8px 0;
            background: #111; border: 1px solid #444; color: #fff;
            font-size: 16px; box-sizing: border-box;
        }

      /* Couleur grise quand aucune option valide n'est choisie */
        select:invalid {
            color: gray;
        }
        
        /* Couleur blanche dès qu'une option est sélectionnée */
        select:valid {
            color: white;
        }
        
        /* On remet les options en noir pour qu'elles soient lisibles dans la liste */
        option {
            color: black;
        }

        button {
            width: 100%; padding: 15px; margin-top: 15px;
            background: #fff; color: #000; border: none; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
        }

        button:disabled { background: #333; color: #666; }

        #fs-button {
          position: fixed; 
          bottom: 15px; 
          right: 15px; 
          z-index: 100;
          width: 40px;
          height: 40px;
          /* background-image: url('TemplateData/fullscreen.png'); /* Remplacez par le nom de votre fichier */
          background-size: contain;      /* L'image s'adapte à la taille du bouton */
          background-repeat: no-repeat;
          background-position: center;
          background-color: transparent; /* Supprime le fond gris/blanc */
          border: none;
          cursor: pointer;
          outline: none;
          padding: 0;

</head>

    <script>
    // On désactive immédiatement l'interception de Unity
    window.onload = function() {
        gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                var b = document.getElementById("start-button");
                if (b) {
                    b.innerHTML = "DOWNLOADING : " + Math.round(progress * 100) + "%";
                    if (progress >= 1) {
                        b.innerHTML = "Start";
                        b.disabled = false;
                    }
                }
            }
        });
    };

        function launchGame() {
            var n = document.getElementById("nationality").value;
            var b = document.getElementById("birthdate").value;
            var g = document.getElementById("gender").value;

            /*if (!n || !b || !g) {
                alert("Champs incomplets");
                return;
            }*/
            if(!n) n = "Inconnu";
            if(!b) b = "Inconnu";
            if(!g) g = "Inconnu";
          
            // Envoi à Unity
            //gameInstance.SendMessage('URLFormManager', 'ReceiveIP', userIP);  
            gameInstance.SendMessage('URLFormManager', 'ReceiveNationality', n);
            gameInstance.SendMessage('URLFormManager', 'ReceiveGender', g);
            gameInstance.SendMessage('URLFormManager', 'ReceiveBirthday', b);

            // On cache l'overlay et on redonne le clavier à Unity
            window.focus();
            document.getElementById("unityContainer").focus();
            document.getElementById("loading-overlay").style.display = "none";
            //document.getElementById("fs-button").style.display = "none";
            /*if (typeof WebGLInput !== "undefined") {
                WebGLInput.captureAllKeyboardInput = true;
            }*/
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
