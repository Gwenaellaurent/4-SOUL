<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL | Existential Archetypes</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            height: 100dvh; overflow: hidden; background: #000;
        }

        /* L'OVERLAY : On force l'affichage au-dessus de TOUT avec z-index 9999 */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100dvh;
            background-color: #000;
            z-index: 9999 !important; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: visible; /* On force la visibilité */
        }

        #loading-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
        }

        #ui-container {
            z-index: 10000;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            color: white;
            border: 2px solid #555;
            min-width: 280px;
        }

        input { padding: 12px; margin: 10px; border-radius: 5px; border: none; width: 80%; }
        
        button { 
            padding: 12px 25px; background: #4CAF50; color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        #unityContainer { width: 100vw; height: 100dvh; z-index: 1; }
    </style>
</head>

<body>
    <!-- Cet élément DOIT être visible au démarrage -->
    <div id="loading-overlay">
        <img src="TemplateData/background_compressed.png" id="loading-bg" onerror="this.style.display='none';">
        
        <div id="ui-container">
            <h2 style="margin-top:0;">Existential Archetypes</h2>
            <p id="loading-status">Initialisation...</p>
            
            <input type="text" id="username" placeholder="Entrez votre nom...">
            <br>
            <!-- Bouton caché par défaut -->
            <button id="start-button" style="display:none;" onclick="launchGame()">ENTRER DANS L'ABYSS</button>
        </div>
    </div>

    <div id="unityContainer"></div>

    <script>
        // 1. Bloquer l'alerte mobile immédiatement
        window.alert = function(msg) {
            console.log("Alerte bloquée : " + msg);
            if (msg.indexOf("nom") !== -1) return window.confirm(msg); // Laisse passer mon alerte de nom
            return true;
        };

        // 2. Lancer Unity
        var gameInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json", {
            onProgress: function(instance, progress) {
                var status = document.getElementById("loading-status");
                var btn = document.getElementById("start-button");
                
                var percentage = Math.round(progress * 100);
                status.innerHTML = "Téléchargement : " + percentage + "%";
                
                if (progress >= 1) {
                    status.innerHTML = "Liaison prête !";
                    btn.style.setProperty('display', 'inline-block', 'important');
                }
            }
        });

        // 3. Fonction pour enfin cacher l'overlay
        function launchGame() {
            var user = document.getElementById("username").value;
            if (user.trim() === "") {
                // On utilise un petit hack pour que l'alerte de nom marche quand même
                var name = prompt("Veuillez entrer un nom :");
                if (!name) return;
                document.getElementById("username").value = name;
            }
            
            // On cache l'overlay
            document.getElementById("loading-overlay").style.display = "none";
            console.log("Jeu lancé pour : " + user);
        }
    </script>
</body>
</html>
