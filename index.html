<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | Existential Archetypes</title>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <style>
      /* Styles existants */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: black;
        font-family: sans-serif;
      }

      #unityContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100%;
        height: 100dvh;
      }
      
      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* --- NOUVEAU STYLE POUR L'OVERLAY --- */
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* REMPLACEZ L'URL CI-DESSOUS PAR VOTRE IMAGE */
        background: url('TemplateDate/background_compressed.png') no-repeat center center;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999; /* Devant Unity */
        transition: opacity 0.8s ease;
      }

      .form-container {
        background: rgba(255, 255, 255, 0.9);
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        min-width: 280px;
      }

      .form-container input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .form-container button {
        background: #222;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 16px;
      }

      .form-container button:hover {
        background: #444;
      }
    </style>

    <script>
    // Neutralisation des alertes
    var originalAlert = window.alert;
    window.alert = function(message) {
      if (message.indexOf("WebGL") !== -1 || message.indexOf("compatibility") !== -1) {
        console.log("Alerte Unity bloquée : " + message);
        return true; 
      }
      return originalAlert(message);
    };
  
    // Forçage non-mobile
    if (typeof UnityLoader !== "undefined" && UnityLoader.SystemInfo) {
      UnityLoader.SystemInfo.mobile = false;
    }
  
    // Instance Unity
    var unityInstance = UnityLoader.instantiate("unityContainer", "Build/4-SOUL.json");

    // --- FONCTION POUR FERMER L'OVERLAY ---
    function startApp() {
      var overlay = document.getElementById('loading-overlay');
      var name = document.getElementById('userInput').value;

      if(name.trim() === "") {
        alert("Please enter a name to continue.");
        return;
      }

      // Effet de disparition
      overlay.style.opacity = '0';
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 800);

      console.log("Starting for user: " + name);
      // Optionnel : Envoyer le nom à Unity
      // unityInstance.SendMessage('NomDuGameObject', 'MethodeReception', name);
    }
    </script>
  </head>

  <body>
    <!-- NOUVEL OVERLAY -->
    <div id="loading-overlay">
      <div class="form-container">
        <h2>Existential Archetypes</h2>
        <input type="text" id="userInput" placeholder="Enter your name...">
        <br>
        <button onclick="startApp()">Continuer</button>
      </div>
    </div>

    <!-- CONTENEUR UNITY -->
    <div id="unityContainer"></div>
  </body>
</html>
